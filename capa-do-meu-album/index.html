<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Capa do álbum visual Máfia Azul GuiGui, uma atividade de apresentação pessoal em cinco faixas.">
  <title>Máfia Azul GuiGui | Capa do Meu Álbum</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #f7f6ed; background: #111825; font: 1.05rem/1.55 "Segoe UI", Arial, sans-serif; }
    main { width: min(100% - 2.5rem, 62rem); margin: auto; padding-block: clamp(2rem, 6vw, 5.5rem); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr); gap: clamp(2rem, 6vw, 5rem); align-items: center; }
    h1 { font: 700 clamp(3rem, 7vw, 5.5rem)/.98 Georgia, serif; letter-spacing: -.045em; margin: .5rem 0 1.4rem; }
    p { max-width: 39ch; }
    .atividade { color: #f4b45c; margin: 0; }
    a { color: #ffcc80; text-underline-offset: .25em; }
    a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 43rem) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="atividade">Capa do Meu Álbum</p>
      <h1>Máfia Azul GuiGui</h1>
      <p>Uma apresentação pessoal em formato de álbum. As cinco faixas respondem a perguntas sobre uma crença, um valor, um talento, um medo e um sonho.</p>
      <a href="../capa-meu-album.png">Ver a capa em tamanho original</a>
    </div>
    <img src="../capa-meu-album.png" width="937" height="1678" alt="Capa azul, laranja e preta com os escudos de Cruzeiro, Knicks e Chelsea, três arenas e cinco faixas.">
  </main>
</body>
</html>
